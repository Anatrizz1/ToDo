<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Um To-Do List simples e eficiente para organizar suas tarefas diárias.">
    <title>To Do List</title>
    <link rel="stylesheet" href="ToDo.css">
    <link rel="icon" href="imagem/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
    </header>
    <main>
        <div class="header-title">
            <h1 class = "header-title__title">To Do List</h1>  
            <p class="header-title__description">Organize suas tarefas de forma simples e eficiente</p>
        </div>
        <div id="taskInputContainer" class="main-input__task">
            <input type="text" id="taskInput" placeholder="Digite uma nova tarefa" aria-label="Digite o nome da nova tarefa">
            <button id="addTaskButton">Adicionar Tarefa</button>
        </div>
        <div class="filters" id="filters">
            <button class="filters__button active" data-filter="all">Todas</button>
            <button class="filters__button" data-filter="active">Pendentes</button>
            <button class="filters__button" data-filter="completed">Concluídas</button>
        </div>
        <ul id="taskList">
        </ul>
    </main>
    <footer>
        <p>&copy; 2025 To Do List. Todos os direitos reservados.</p>
    </footer>
   <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="ToDo.js"></script>
</body>
</html>
